name: Release — All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

env:
  VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    name: Windows Installer & Portable (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }

      - name: Build Windows Installer & Portable ZIP
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ env.VERSION_TAG }}".TrimStart('v')
          .\packaging\windows\build-windows.ps1 -Arch ${{ matrix.arch }} -Version $ver

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: |
            dist/NextN-Setup-${{ matrix.arch }}.exe
            dist/NextN-windows-${{ matrix.arch }}-portable.zip

  build-macos:
    name: macOS DMG & ZIP Installer (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, x64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install macOS cross-packaging toolchain (xorriso, libdmg-hfsplus, rcodesign)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip curl xorriso cmake build-essential zlib1g-dev p7zip-full

          # Build fanquake/libdmg-hfsplus (UDZO DMG compressor, used by Bitcoin Core)
          git clone --depth 1 --branch only_what_core_needs https://github.com/fanquake/libdmg-hfsplus.git /tmp/libdmg-hfsplus
          cmake -S /tmp/libdmg-hfsplus -B /tmp/libdmg-hfsplus/build
          cmake --build /tmp/libdmg-hfsplus/build -j"$(nproc)"
          sudo install -m 0755 /tmp/libdmg-hfsplus/build/dmg/dmg /usr/local/bin/dmg

          # Install rcodesign (apple-codesign) for Apple Silicon ad-hoc Mach-O signing
          RCODESIGN_VER="0.29.0"
          curl -fsSL --retry 4 --retry-delay 2 \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VER}/apple-codesign-${RCODESIGN_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/rcodesign.tar.gz
          tar -C /tmp -xzf /tmp/rcodesign.tar.gz
          sudo install -m 0755 "/tmp/apple-codesign-${RCODESIGN_VER}-x86_64-unknown-linux-musl/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Cross-publish Next N for macOS (${{ matrix.arch }})
        run: |
          VER="${VERSION_TAG#v}"
          dotnet publish src/NextN.Desktop/NextN.Desktop.csproj -c Release -r osx-${{ matrix.arch }} -p:SelfContained=true -p:PublishSingleFile=false -p:Version="$VER" -o publish/osx-${{ matrix.arch }}
          dotnet publish src/NextN.Updater/NextN.Updater.csproj -c Release -r osx-${{ matrix.arch }} -p:SelfContained=true -p:PublishSingleFile=false -p:Version="$VER" -o publish/osx-${{ matrix.arch }}
          find publish/osx-${{ matrix.arch }} -name '*.pdb' -delete

      - name: Package & verify macOS DMG and ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x packaging/macos/package-osx.sh
          ./packaging/macos/package-osx.sh ${{ matrix.arch }} publish/osx-${{ matrix.arch }} "${VERSION_TAG#v}"

          echo "=== Verifying DMG contents via 7z ==="
          7z l "dist/NextN-macos-${{ matrix.arch }}.dmg" | head -n 40
          echo "=== Verifying ZIP contents ==="
          unzip -l "dist/NextN-macos-${{ matrix.arch }}.zip" | grep -E "Info.plist|AppIcon.icns|MacOS/NextN$|bin/xray/xray|bin/sing_box/sing-box"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: |
            dist/NextN-macos-${{ matrix.arch }}.dmg
            dist/NextN-macos-${{ matrix.arch }}.zip

  build-linux:
    name: Linux DEB, RPM, AppImage & ZIP (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            deb_arch: amd64
            appimage_arch: x86_64
          - arch: arm64
            rid: linux-arm64
            deb_arch: arm64
            appimage_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip curl dpkg-dev desktop-file-utils xdg-utils rpm

      - name: Publish Next N (${{ matrix.rid }})
        run: |
          VER="${VERSION_TAG#v}"
          dotnet publish src/NextN.Desktop/NextN.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishSingleFile=false -p:Version="$VER" -o publish/${{ matrix.rid }}
          dotnet publish src/NextN.Updater/NextN.Updater.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version="$VER" -o publish/${{ matrix.rid }}
          find publish/${{ matrix.rid }} -name '*.pdb' -delete

      - name: Build Debian (.deb) package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x packaging/linux/package-debian.sh
          ./packaging/linux/package-debian.sh ${{ matrix.deb_arch }} publish/${{ matrix.rid }} "${VERSION_TAG#v}"

      - name: Build RPM (.rpm) package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x packaging/linux/package-rhel.sh
          ./packaging/linux/package-rhel.sh ${{ matrix.appimage_arch }} publish/${{ matrix.rid }} "${VERSION_TAG#v}"

      - name: Build Universal AppImage (x86_64)
        if: matrix.arch == 'x64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x packaging/linux/package-appimage.sh
          ./packaging/linux/package-appimage.sh x86_64 publish/${{ matrix.rid }} "${VERSION_TAG#v}"

      - name: Build Portable Linux ZIP (for in-app updater)
        run: |
          mkdir -p dist
          (cd publish && zip -qry "../dist/NextN-${{ matrix.rid }}.zip" "${{ matrix.rid }}")

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            dist/NextN-linux-*.deb
            dist/NextN-linux-*.rpm
            dist/NextN-linux-*.AppImage
            dist/NextN-linux-*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets & generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Next N ${{ env.VERSION_TAG }}
          generate_release_notes: true
          files: release-assets/*
