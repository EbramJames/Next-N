name: Feature Request
description: Suggest an enhancement or new feature for Next N.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: "problem"
    attributes:
      label: "Problem / Motivation"
      description: "Describe the workflow or problem this feature addresses."
    validations:
      required: true

  - type: textarea
    id: "solution"
    attributes:
      label: "Proposed Solution"
      description: "Describe how you envision this feature working in Next N."
    validations:
      required: true
